name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP to root
        run: |
          if [ -f "launcher (1).zip" ]; then
            unzip -o "launcher (1).zip" -d temp_extract
          elif [ -f "meu_launcher.zip" ]; then
            unzip -o "meu_launcher.zip" -d temp_extract
          fi
          
          # Move o conteudo da pasta extraida para a raiz
          if [ -d temp_extract ]; then
            cp -r temp_extract/*/* . 2>/dev/null || cp -r temp_extract/* . 2>/dev/null || true
            rm -rf temp_extract
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: nacaoazul-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
concurrency: 
