name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Unzip project
        run: |
          if [ -f "launcher (1).zip" ]; then
            unzip -o "launcher (1).zip" -d extracted_folder
            cp -r extracted_folder/* .
          elif [ -f "meu_launcher.zip" ]; then
            unzip -o "meu_launcher.zip" -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: nacaoazul-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
