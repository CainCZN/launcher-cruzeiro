name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Project Structure
        run: |
          if [ -f "launcher (1).zip" ]; then
            unzip -o "launcher (1).zip" -d extracted_proj || true
            cp -r extracted_proj/*/* . 2>/dev/null || cp -r extracted_proj/* . 2>/dev/null || true
            rm -rf extracted_proj
          elif [ -f "meu_launcher.zip" ]; then
            unzip -o "meu_launcher.zip" -d extracted_proj || true
            cp -r extracted_proj/*/* . 2>/dev/null || cp -r extracted_proj/* . 2>/dev/null || true
            rm -rf extracted_proj
          fi
          mkdir -p app/src/main/java/com/nacaoazul/launcher

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nacaoazul-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
